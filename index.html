<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Wings – Teacher App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1e2a78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Wings">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{--navy:#1e2a78;--blue:#2563eb;--green:#22963a;--yellow:#f5b301;--pink:#e5337a;--purple:#7b3fbf;--orange:#f28c18;
--bg:#f3f5fb;--card:#fff;--ink:#1e2230;--muted:#6b7285;--line:#e3e7f1;--r:18px;--shadow:0 2px 10px rgba(30,42,120,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.brand{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top img{width:44px;height:44px;border-radius:50%;background:#fff}
header.top .brand{font-size:20px;letter-spacing:.3px}
header.top small{display:block;font-size:11.5px;opacity:.8;font-family:Nunito}
.sync{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#9aa3c7;vertical-align:1px}
.sync.ok i{background:#4ade80}.sync.local i{background:var(--yellow)}
.rainbow{height:4px;background:linear-gradient(90deg,var(--pink) 0 16.6%,var(--orange) 0 33.3%,var(--yellow) 0 50%,var(--green) 0 66.6%,var(--blue) 0 83.3%,var(--purple) 0)}
main{padding:16px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav.bottom button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--navy)}
nav.bottom button.on svg{color:var(--blue)}
nav.bottom .plus{background:var(--pink);color:#fff;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 14px rgba(229,51,122,.35)}
nav.bottom button.reg{color:var(--pink)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:18px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hello{margin:2px 2px 14px}.hello h1{font-size:26px;color:var(--navy)}.hello p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border-radius:var(--r);padding:14px;color:#fff;position:relative;overflow:hidden}
.stat b{font-family:"Baloo 2";font-size:34px;display:block;line-height:1}
.stat span{font-size:13px;font-weight:700;opacity:.95}
.stat:after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.15)}
.pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pie-wrap svg{width:170px;height:170px;flex:none}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.legend div{display:flex;align-items:center;gap:8px;font-weight:700}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend em{margin-left:auto;font-style:normal;color:var(--muted);font-weight:600}
select,input[type=text],input[type=tel],input[type=email],input[type=date],input[type=search],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.ghost{background:#eef1fa;color:var(--navy)}.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}.btn.danger{background:#fdecec;color:#c62828}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:#fff;box-shadow:var(--shadow);cursor:pointer;border:0;width:100%;text-align:left}
.sitem .meta{flex:1;min-width:0}.sitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem small{color:var(--muted)}
.av{width:46px;height:46px;border-radius:14px;flex:none;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#fff;font-family:"Baloo 2";font-size:18px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:800;color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0 12px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;color:var(--navy);font-family:"Baloo 2";font-size:18px;margin-bottom:4px}
.phead{background:linear-gradient(135deg,var(--navy),#3442a8);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.phead .top{display:flex;gap:14px;align-items:center}
.phead .ph{width:84px;height:96px;border-radius:16px;object-fit:cover;border:3px solid #fff;flex:none;display:grid;place-items:center;font-family:"Baloo 2";font-size:30px}
.phead h2{font-size:24px}.phead p{margin:3px 0 0;opacity:.85;font-size:13.5px}
.back{background:none;border:0;color:var(--navy);font-weight:800;padding:0 0 10px;cursor:pointer;display:flex;align-items:center;gap:4px}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dl button{border:0;background:#fff;border-radius:14px;padding:10px 4px;box-shadow:var(--shadow);font-weight:800;font-size:12px;color:var(--navy);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.dl button i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-style:normal}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.tabs button.on{background:var(--navy);color:#fff}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;font-weight:700;word-break:break-word}
.tagbox{margin-bottom:14px}
.tagbox h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border-radius:99px;font-weight:700;font-size:13px}
.tag button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;font-size:13px}
.addrow{display:flex;gap:6px}.addrow input{padding:8px 11px}
.lcol{border-radius:14px;padding:12px;margin-bottom:10px}
.lcol h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.litem{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:7px 8px 7px 11px;margin-bottom:6px;font-weight:700;font-size:13.5px}
.litem span{flex:1}
.litem button{border:0;background:#eef1fa;border-radius:8px;padding:4px 7px;cursor:pointer;font-size:12px;font-weight:800;color:var(--navy)}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sugg button{border:1px dashed #b9c0d6;background:transparent;border-radius:99px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:700}
.skill{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border:0}
.skill b{font-size:14px}.skill small{display:block;color:var(--muted);font-weight:700}
.dots{display:flex;gap:4px}
.dots button{width:26px;height:26px;border-radius:8px;border:0;background:#e8ebf3;cursor:pointer;font-size:11px;font-weight:800;color:#fff}
.entry{border-left:4px solid var(--orange);background:#fff8ec;border-radius:10px;padding:9px 11px;margin-bottom:8px;position:relative}
.entry.act{border-color:var(--purple);background:#f5effc}
.entry small{color:var(--muted);font-weight:800;font-size:12px}
.entry p{margin:3px 0 0;font-weight:600}
.entry .x{position:absolute;right:6px;top:6px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.photo-in{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.photo-in .ph{width:86px;height:100px;border-radius:16px;background:#eef1fa;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:800;overflow:hidden;flex:none;text-align:center}
.photo-in .ph img{width:100%;height:100%;object-fit:cover}
fieldset{border:0;padding:0;margin:0}
.sec-t{font-family:"Baloo 2";font-size:17px;color:var(--navy);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t i{width:6px;height:18px;border-radius:3px}
.sticky-save{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;padding-top:6px}
.sticky-save .btn{flex:1;box-shadow:0 6px 16px rgba(30,42,120,.25)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,50,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{color:var(--navy);font-size:20px;margin-bottom:10px}
.sheet .acts{display:flex;gap:8px;margin-top:14px}.sheet .acts .btn{flex:1}
.idprev{width:216px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#fff;font-size:10px}
.idprev .h{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:8px}
.idprev .h img{width:52px;height:52px;border-radius:50%;background:#fff}
.idprev .h b{font-family:"Baloo 2";font-size:17px;display:block;line-height:1}
.idprev .h em{color:var(--yellow);font-size:9px;font-weight:800}
.idprev .body{text-align:center;padding:10px 12px 6px}
.idprev .body .ph{width:80px;height:94px;margin:0 auto 6px;border-radius:6px;border:4px solid;object-fit:cover;display:grid;place-items:center;font-family:"Baloo 2";font-size:26px;background:#eef1fa;color:var(--navy)}
.idprev .nm{font-family:"Baloo 2";font-size:16px;color:var(--navy);text-transform:uppercase;line-height:1.1}
.idprev table{margin:6px auto 2px;text-align:left;font-size:10.5px}
.idprev td:first-child{color:var(--muted);padding-right:8px}
.idprev td:last-child{font-weight:800}
.tlist .t{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tlist .t:last-child{border:0}
.tlist .meta{flex:1}.tlist small{color:var(--muted)}
.muted{color:var(--muted)}
.banner{background:#fff6dd;border:1px solid #f5d77a;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:12px;color:#7a5a00}
.bday{display:flex;align-items:center;gap:10px;padding:6px 0}
.login{text-align:center;padding:30px 10px}
.login img{width:180px;height:180px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(30,42,120,.18)}
.login h1{font-size:30px;color:var(--navy);margin:18px 0 4px}
.gbtn{background:#fff;color:#1e2230;border:1.5px solid var(--line);box-shadow:var(--shadow);padding:13px 20px;font-size:16px;margin-top:22px}
.role{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#eef1fa;color:var(--navy)}
.role.admin{background:#fde7f0;color:#a3204f}.role.pending{background:#fff1e0;color:#a85c00}
code{background:#eef1fa;padding:1px 5px;border-radius:5px;font-size:13px}
@media (min-width:600px){main{padding:20px}}
</style>
</head>

<script>
/* ---------- PDF builders (jsPDF) ---------- */
const PDF = (() => {
  const NAVY=[30,42,120], BLUE=[37,99,235], GREEN=[34,150,58], YELLOW=[245,179,1], PINK=[229,51,122],
        PURPLE=[123,63,191], ORANGE=[242,140,24], GREY=[105,112,130], DARK=[30,34,48], LIGHT=[244,246,252], LINE=[214,219,232], WHITE=[255,255,255];
  const RAINBOW=[PINK,ORANGE,YELLOW,GREEN,BLUE,PURPLE];
  const CLASS_RGB={Playgroup:PINK,Nursery:ORANGE,LKG:GREEN,UKG:BLUE,Daycare:PURPLE};
  const J = o => new (window.jspdf.jsPDF)(o);
  const F=(d,c)=>d.setFillColor(...c), S=(d,c)=>d.setDrawColor(...c), T=(d,c)=>d.setTextColor(...c);
  const font=(d,style,size)=>{d.setFont('helvetica',style);d.setFontSize(size);};
  const clean = s => String(s ?? '').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'');
  const fmtDate = s => { if(!s) return ''; const p=String(s).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s; };
  function age(dob){ if(!dob) return ''; const b=new Date(dob+'T00:00:00'), n=new Date(); let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth(); if(n.getDate()<b.getDate()) m--; if(m<0||isNaN(m)) return ''; const y=Math.floor(m/12), mo=m%12; return `${y} yr${y===1?'':'s'}${mo?` ${mo} mo`:''}`; }
  function rainbow(d,x,y,w,h){ const sw=w/6; RAINBOW.forEach((c,i)=>{F(d,c); d.rect(x+i*sw,y,sw+0.3,h,'F');}); }
  function initials(n){ return clean(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?'; }
  function photo(d,st,x,y,w,h){
    if(st.photo){ try{ d.addImage(st.photo,'JPEG',x,y,w,h); return; }catch(e){} }
    F(d,LIGHT); d.rect(x,y,w,h,'F'); T(d,NAVY); font(d,'bold',Math.min(w,h)*1.2); d.text(initials(st.name),x+w/2,y+h/2,{align:'center',baseline:'middle'});
  }
  function fit(d,text,maxW,size,minSize=6){ let s=size; d.setFontSize(s); while(s>minSize && d.getTextWidth(text)>maxW){ s-=0.5; d.setFontSize(s);} return s; }
  function cell(d,x,y,w,h,label,value){
    S(d,LINE); d.setLineWidth(0.25); d.rect(x,y,w,h);
    T(d,GREY); font(d,'normal',6.8); d.text(clean(label).toUpperCase(),x+2,y+3.6);
    T(d,DARK); font(d,'bold',9.5);
    const lines=d.splitTextToSize(clean(value)||' ',w-4); const max=Math.max(1,Math.floor((h-5)/4.2));
    d.text(lines.slice(0,max),x+2,y+8.2);
  }
  function section(d,M,W,y,title,c){
    F(d,c); d.roundedRect(M,y,3,6,1,1,'F');
    T(d,NAVY); font(d,'bold',11.5); d.text(clean(title),M+5.5,y+4.6);
    S(d,LINE); d.setLineWidth(0.3); d.line(M+5.5+d.getTextWidth(clean(title))+3,y+3,W-M,y+3);
    return y+8.5;
  }
  function schoolHeader(d,ctx,W,M){
    const sc=ctx.school||{};
    rainbow(d,0,0,W,3);
    d.addImage(ctx.logo,'PNG',M,7,27,27);
    T(d,NAVY); font(d,'bold',19); d.text(clean(sc.name||'Little Wings Play School').toUpperCase(),M+32,16);
    font(d,'normal',8.8); T(d,GREY);
    const addr=clean(sc.address||''); if(addr) d.text(d.splitTextToSize(addr,W-2*M-34)[0],M+32,22);
    const contact=[sc.phone&&('Ph: '+sc.phone),sc.email].filter(Boolean).map(clean).join('   |   '); if(contact) d.text(contact,M+32,27);
    T(d,PINK); font(d,'bolditalic',9.5); d.text('Play, Learn, Fly High!',M+32,32.5);
  }
  function footer(d,W,H,ctx){
    const n=d.getNumberOfPages();
    for(let i=1;i<=n;i++){ d.setPage(i); rainbow(d,0,H-3,W,3); T(d,GREY); font(d,'normal',7.5);
      d.text(clean((ctx.school&&ctx.school.name)||'Little Wings Play School')+'  -  generated '+new Date().toLocaleDateString('en-GB'),14,H-6);
      d.text(`Page ${i} of ${n}`,W-14,H-6,{align:'right'}); }
  }

  /* ===== 1. Admission application (A4) ===== */
  function application(st,ctx){
    const d=J({unit:'mm',format:'a4'}), W=210, H=297, M=14, CW=W-2*M;
    schoolHeader(d,ctx,W,M);

  /* ===== 3. Parent meeting report (A4) ===== */

    rainbow(d,0,36,W,2);
    // child card

    const cc=CLASS_RGB[st.cls]||NAVY; F(d,cc); d.roundedRect(M+3,y+3,30,32,2,2,'F'); photo(d,st,M+4,y+4,28,30);

    info.forEach(([l,v],i)=>{ const x=M+38+(i%2)*72, yy=y+18+Math.floor(i/2)*7; T(d,GREY); font(d,'normal',8); d.text(l,x,yy); T(d,DARK); font(d,'bold',9.5); d.text(clean(v)||'-',x+26,yy); });
    y+=45;

    const bw=(CW-4)/2;

      const pair=boxes.slice(r*2,r*2+2).map(([t,list,c])=>{ font(d,'normal',9); const txt=(list&&list.length)?list.map(clean).join('  -  '):'Not added yet'; return {t,c,lines:d.splitTextToSize(txt,bw-6),empty:!(list&&list.length)}; });
      const bh=Math.max(...pair.map(p=>p.lines.length))*4.3+12; ensure(bh+3);

      let yy=y+13.5; const empty=!(list&&list.length);
      colLines[i].forEach(lines=>{ if(!empty){ F(d,c); if(i===0){ S(d,c); d.setLineWidth(0.7); d.line(x+3,yy-1.3,x+4.2,yy-0.1); d.line(x+4.2,yy-0.1,x+6.3,yy-2.8); } else d.circle(x+4.5,yy-1.3,1,'F'); }

    y+=4;
    // home tips
    const practice=[...(st.learning||[]),...(st.next||[])].slice(0,6).map(clean);
    font(d,'normal',9.2); const tip=practice.length?'Spend 10 minutes a day practising together: '+practice.join(', ')+'. Praise every small step - your encouragement helps your child fly high!':'Read a picture book together every day, talk about your child\'s day at school, and praise every small step.';
    const TL=d.splitTextToSize(tip,CW-10); const th=TL.length*4.3+12; ensure(th+30);

    ensure(10); S(d,DARK); d.setLineWidth(0.3);
    [['Class Teacher',M],['Parent / Guardian',M+66],['Principal',M+132]].forEach(([l,x])=>{ d.line(x,y,x+50,y); T(d,GREY); font(d,'normal',8.5); d.text(l,x,y+4.5); });
    footer(d,W,H,ctx); return d;
  }
  function idcardMany(list,ctxs){ let d=null; list.forEach((s,i)=>{ d=idcard(s,ctxs[i],d); }); return d; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmt = PDF.fmtDate, age = PDF.age;
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function avatar(st, cls='av'){ return st.photo ? `<img class="${cls}" src="${esc(st.photo)}" alt="">` : `<div class="${cls}" style="background:${CCOL[st.cls]||'#1e2a78'}">${esc(initials(st.name))}</div>`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function sheet(html){ $('#sheet').innerHTML = html ? `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>` : ''; }
function closeSheet(){ sheet(''); }
function confirmBox(title, text, okLabel='Delete'){ return new Promise(res=>{ window._cres=res; sheet(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="acts"><button class="btn ghost" onclick="closeSheet();_cres(false)">Cancel</button><button class="btn danger" onclick="closeSheet();_cres(true)">${esc(okLabel)}</button></div>`); }); }

/* ---------- data store: Firebase (Google sign-in + Firestore) ---------- */
const DEFAULT_SCHOOL = { name:'Little Wings Play School', address:'', phone:'', email:'', year:'' };
const Store = {
  mode:'loading', // setup | loading | signedout | pending | ready
  readOnly:false, user:null, me:null, fs:null, auth:null, meUnsub:null, dataUnsubs:[], queues:{},
  data:{ students:{}, teachers:{}, users:{}, school:{...DEFAULT_SCHOOL} },
  init(){
    const cfg = window.FIREBASE_CONFIG || {};
    if (!window.firebase || !cfg.apiKey || /PASTE/i.test(cfg.apiKey)) { this.mode = 'setup'; render(); return; }
    firebase.initializeApp(cfg);
    this.auth = firebase.auth(); this.fs = firebase.firestore();
    this.fs.enablePersistence({ synchronizeTabs:true }).catch(()=>{});
    this.auth.getRedirectResult().catch(e => toast(authMsg(e)));
    this.auth.onAuthStateChanged(u => this.onUser(u));
  },
  signIn(){
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
    this.auth.signInWithPopup(p).catch(e => {
      if (['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) this.auth.signInWithRedirect(p);
      else if (e.code !== 'auth/popup-closed-by-user') toast(authMsg(e));
    });
  },
  signOut(){ closeSheet(); this.auth.signOut(); },
  async onUser(u){
    this.stopData(); if (this.meUnsub) { this.meUnsub(); this.meUnsub = null; }
    this.user = u; this.me = null;
    if (!u) { this.mode = 'signedout'; setSync(); render(); return; }
    this.mode = 'loading'; setSync(); render();
    try {
      const ref = this.fs.doc('users/' + u.uid);
      const snap = await ref.get();
      if (!snap.exists) {
        const prof = { uid:u.uid, email:u.email, name:u.displayName || u.email, photo:u.photoURL || '', createdAt:Date.now() };
        let made = false;
        const boot = await this.fs.doc('meta/bootstrap').get().catch(() => null);
        if (boot && !boot.exists) {
          try { const b = this.fs.batch(); b.set(ref, {...prof, role:'admin'}); b.set(this.fs.doc('meta/bootstrap'), { by:u.uid, at:Date.now() }); await b.commit(); made = true; toast('Welcome! You are the first Admin.'); } catch(e) {}
        }
        if (!made) await ref.set({...prof, role:'pending'});
      }
      this.meUnsub = ref.onSnapshot(s => {
        const before = this.me && this.me.role; this.me = s.data() || null; const role = this.me && this.me.role;
        if (role === 'admin' || role === 'teacher') { if (this.mode !== 'ready' || before !== role) { this.mode = 'ready'; this.subscribeData(); } }
        else { this.mode = 'pending'; this.stopData(); }
        setSync(); render();
      }, () => { this.mode = 'pending'; setSync(); render(); });
    } catch(e) { console.error(e); toast('Sign-in problem: ' + (e.code || e.message)); this.mode = 'signedout'; setSync(); render(); }
  },
  subscribeData(){
    this.stopData(); const fs = this.fs;
    const col = c => this.dataUnsubs.push(fs.collection(c).onSnapshot(snap => {
      const m = {}; snap.forEach(d => { m[d.id] = d.data(); }); this.data[c] = m; scheduleRender();
    }, e => toast('Could not load ' + c + ' (' + e.code + ')')));
    col('students'); col('teachers'); if (isAdmin()) col('users');
    this.dataUnsubs.push(fs.doc('settings/school').onSnapshot(s => { if (s.exists) this.data.school = Object.assign({}, DEFAULT_SCHOOL, s.data()); scheduleRender(); }, () => {}));
  },
  stopData(){ this.dataUnsubs.forEach(f => f()); this.dataUnsubs = []; this.data.students = {}; this.data.teachers = {}; this.data.users = {}; },
  write(path, fn){
    const q = this.queues[path] || Promise.resolve();
    return this.queues[path] = q.then(fn).catch(err => {
      console.error(err);
      if (err && err.code === 'permission-denied') toast('You don’t have permission for that – ask the Admin');
      else if (err && err.code === 'resource-exhausted') toast('Daily free limit reached – try again tomorrow');
      else toast('Could not save – check your internet and try again');
    });
  },
  save(col, obj){ obj.updatedAt = Date.now(); this.data[col][obj.id] = obj; return this.write(col + '/' + obj.id, () => this.fs.collection(col).doc(obj.id).set(obj)); },
  remove(col, id){ delete this.data[col][id]; return this.write(col + '/' + id, () => this.fs.collection(col).doc(id).delete()); },
  saveSchool(obj){ this.data.school = obj; return this.write('settings/school', () => this.fs.doc('settings/school').set(obj)); },
  setRole(uid, role){ return this.write('users/' + uid, () => this.fs.doc('users/' + uid).update({ role })); },
  removeUser(uid){ return this.write('users/' + uid, () => this.fs.doc('users/' + uid).delete()); }
};

function pie(counts){
  const total = counts.reduce((a,c)=>a+c.n,0);
  if (!total) return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="#e8ebf3" stroke-width="22"/><text x="60" y="64" text-anchor="middle" font-family="Baloo 2" font-size="14" fill="#6b7285">No data</text></svg>`;
  let a0 = -Math.PI/2; const R=44, cx=60, cy=60;
  const segs = counts.filter(c=>c.n).map(c => {
    const frac = c.n/total;
    if (frac>=0.9999) return `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${c.c}" stroke-width="22"/>`;
    const a1 = a0 + frac*2*Math.PI, large = frac>0.5?1:0;
    const p = `M ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A ${R} ${R} 0 ${large} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}`;
    a0 = a1; return `<path d="${p}" fill="none" stroke="${c.c}" stroke-width="22"><title>${c.k}: ${c.n}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 120 120">${segs}<circle cx="60" cy="60" r="32" fill="#fff"/><text x="60" y="62" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="24" fill="#1e2a78">${total}</text><text x="60" y="76" text-anchor="middle" font-size="9" font-weight="700" fill="#6b7285">students</text></svg>`;
}

function pickPhoto(input){
  const file = input.files && input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const W=300, H=350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
    const sc = Math.max(W/img.width, H/img.height), w=img.width*sc, h=img.height*sc;
    x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    S.draftPhoto = c.toDataURL('image/jpeg',0.78); $('#phPrev').innerHTML = `<img src="${S.draftPhoto}">`;
  }; img.onerror = () => toast('Could not read that image'); img.src = r.result; };
  r.readAsDataURL(file);
}
function saveStudent(){

  if (!g('name') || !g('dob') || !g('gender') || !g('cls')) { toast('Please fill name, date of birth, gender and class'); return; }
  const base = S.editId ? clone(Store.data.students[S.editId]) : { id: uid('s'), createdAt: Date.now(), likes:{}, learned:[], learning:[], next:[], activities:[], notes:[], skills:{} };
  Object.assign(base, { name:g('name'), dob:g('dob'), gender:g('gender'), blood:g('blood'), motherTongue:g('motherTongue'), prevSchool:g('prevSchool'),
    admNo:g('admNo')||nextAdmNo(), admDate:g('admDate'), cls:g('cls'), teacherId:g('teacherId'), transport:g('transport'),
    father:{name:g('f_name'),phone:g('f_phone'),occ:g('f_occ'),email:g('f_email')}, mother:{name:g('m_name'),phone:g('m_phone'),occ:g('m_occ'),email:g('m_email')},
    address:g('address'), emergency:{name:g('e_name'),relation:g('e_relation'),phone:g('e_phone')}, allergies:g('allergies'), medical:g('medical'), photo:S.draftPhoto||'' });
  const wasEdit = !!S.editId;
  Store.save('students', base);
  toast(wasEdit ? 'Changes saved' : `🎉 ${base.name} registered`);
  S.editId = null; go('student', { sid: base.id, tab: 'details' });
}

/* ---------- Student profile ---------- */
function cur(){ return Store.data.students[S.sid]; }
function upd(fn){ const s = clone(cur()); fn(s); Store.save('students', s); render(); }
function viewStudent(){
  const s = cur();
  if (!s) return `<button class="back" onclick="go('students')">‹ Students</button><div class="empty"><b>Student not found</b>It may have been removed.</div>`;
  const tabs = [['details','Details'],['likes','Likes & Food'],['learning','Learning'],['skills','Progress'],['activities','Activities'],['notes','Notes']];
  const cc = CCOL[s.cls]||'#1e2a78';
  return `
  <button class="back" onclick="go('students')">‹ Students</button>
  <div class="phead"><div class="top">${s.photo?`<img class="ph" src="${esc(s.photo)}" alt="">`:`<div class="ph" style="background:${cc}">${esc(initials(s.name))}</div>`}
    <div style="min-width:0"><h2>${esc(s.name)}</h2><p><span class="pill" style="background:${cc}">${esc(s.cls||'')}</span> &nbsp;${esc(s.admNo||'')}</p><p>${esc(age(s.dob))}${s.teacherId?' · 👩‍🏫 '+esc(teacherName(s.teacherId)):''}</p></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" style="background:rgba(255,255,255,.16)" onclick="go('register',{editId:'${esc(s.id)}'})">✏️ Edit details</button><button class="btn sm" style="background:rgba(255,255,255,.16)" onclick="showId('${esc(s.id)}')">🪪 ID preview</button></div>
  </div>
  <div class="dl">
    <button onclick="download('application')"><i style="background:var(--blue)">📄</i>Application<br>A4 PDF</button>
    <button onclick="download('idcard')"><i style="background:var(--green)">🪪</i>ID card<br>PDF</button>
    <button onclick="download('report')"><i style="background:var(--pink)">👪</i>Parent<br>report PDF</button>
  </div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>
  ${({details:tabDetails,likes:tabLikes,learning:tabLearning,skills:tabSkills,activities:tabActivities,notes:tabNotes}[S.tab]||tabDetails)(s)}`;
}
function tabDetails(s){
  const f=s.father||{}, m=s.mother||{}, e=s.emergency||{};
  const kv = rows => `<dl class="kv">${rows.filter(r=>r[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')||'<dd class="muted">Not added</dd>'}</dl>`;
  return `
  <div class="card"><h3>🧒 Child</h3>${kv([['Date of birth',fmt(s.dob)],['Age',age(s.dob)],['Gender',s.gender],['Blood group',s.blood],['Mother tongue',s.motherTongue],['Admission date',fmt(s.admDate)],['Transport',s.transport],['Previous school',s.prevSchool]])}</div>
  <div class="card"><h3>👨‍👩‍👧 Parents</h3>${kv([['Father',f.name],['Father mobile',f.phone],['Occupation',f.occ],['Email',f.email]])}<div style="height:10px"></div>${kv([['Mother',m.name],['Mother mobile',m.phone],['Occupation',m.occ],['Email',m.email]])}</div>
  <div class="card"><h3>🏠 Address & emergency</h3>${kv([['Address',s.address],['Emergency',[e.name,e.relation&&'('+e.relation+')'].filter(Boolean).join(' ')],['Emergency mobile',e.phone]])}</div>
  <div class="card"><h3>🩺 Health</h3>${kv([['Allergies',s.allergies||'None'],['Medical',s.medical||'None']])}</div>
  ${isAdmin()?'<button class="btn danger block" onclick="delStudent()">Delete student</button>':''}`;
}
async function delStudent(){
  const s = cur(); if (!s) return;
  if (await confirmBox('Delete '+s.name+'?', 'This removes the student and all their notes, activities and progress. This cannot be undone.')) { Store.remove('students', s.id); toast('Student deleted'); go('students'); }
}
function tagInput(id, onAdd, ph){ return `<form class="addrow" onsubmit="event.preventDefault();const v=this.elements[0].value.trim();if(v){${onAdd}(v);}"><input type="text" placeholder="${ph}"><button class="btn sm">Add</button></form>`; }
function tabLikes(s){
  const lk = s.likes||{};
  return `<div class="card"><h3>💛 What ${esc(s.name.split(' ')[0])} likes</h3>
  ${LIKE_LISTS.map(([k,l,bg,fg])=>`<div class="tagbox"><h4>${l}</h4><div class="tags">${(lk[k]||[]).map((t,i)=>`<span class="tag" style="background:${bg};color:${fg}">${esc(t)}<button onclick="delLike('${k}',${i})" aria-label="Remove">×</button></span>`).join('')||'<span class="muted" style="font-size:13px">Nothing added yet</span>'}</div>
  ${tagInput(k,`addLike.bind(null,'${k}')`,'Add…')}</div>`).join('')}</div>`;
}
function addLike(k,v){ upd(s=>{ s.likes=s.likes||{}; (s.likes[k]=s.likes[k]||[]).push(v); }); }
function delLike(k,i){ upd(s=>{ s.likes[k].splice(i,1); }); }
function tabLearning(s){
  const cols = [['learned','✅ Already learned','#e7f6ea','learning'],['learning','📘 Learning now','#e6effe','learned'],['next','🚀 Learn next','#fff1e0','learning']];
  const used = new Set([...(s.learned||[]),...(s.learning||[]),...(s.next||[])]);
  return cols.map(([k,l,bg,to])=>`<div class="lcol" style="background:${bg}"><h4>${l}<small class="muted">${(s[k]||[]).length}</small></h4>
    ${(s[k]||[]).map((t,i)=>`<div class="litem"><span>${esc(t)}</span>${k==='next'?`<button onclick="moveL('next',${i},'learning')">Start ▸</button>`:k==='learning'?`<button onclick="moveL('learning',${i},'learned')">Done ✓</button>`:`<button onclick="moveL('learned',${i},'learning')">↺</button>`}<button onclick="delL('${k}',${i})" aria-label="Remove">✕</button></div>`).join('')}
    ${tagInput(k,`addL.bind(null,'${k}')`,'Add a skill or topic…')}
    ${k==='next'?`<div class="sugg">${SUGGEST.filter(x=>!used.has(x)).slice(0,10).map(x=>`<button onclick="addL('next','${esc(x)}')">+ ${esc(x)}</button>`).join('')}</div>`:''}
  </div>`).join('') + `<p class="muted" style="font-size:12.5px">Tip: move items along as the child grows — <b>Learn next</b> → <b>Learning now</b> → <b>Already learned</b>. All three lists appear in the parent report.</p>`;
}
function addL(k,v){ upd(s=>{ (s[k]=s[k]||[]).push(v); }); }
function delL(k,i){ upd(s=>{ s[k].splice(i,1); }); }
function moveL(from,i,to){ upd(s=>{ const [v]=s[from].splice(i,1); (s[to]=s[to]||[]).push(v); }); }
function tabSkills(s){
  const sk = s.skills||{};
  return `<div class="card"><h3>🌱 Progress</h3><p class="muted" style="margin:-4px 0 6px;font-size:13px">Tap a level. Parents see these as coloured bars.</p>
  ${SKILLS.map(([k,l])=>{ const r=sk[k]||0; return `<div class="skill"><div><b>${l}</b><small style="color:${r?LCOL[r-1]:''}">${LEVELS[r]}</small></div><div class="dots">${[1,2,3,4,5].map(i=>`<button style="${i<=r?'background:'+LCOL[i-1]:''}" onclick="setSkill('${k}',${i===r?0:i})" aria-label="${LEVELS[i]}">${i}</button>`).join('')}</div></div>`; }).join('')}
  <p class="muted" style="font-size:12px;margin:10px 0 0">1 Beginning · 2 Developing · 3 Progressing · 4 Confident · 5 Excellent</p></div>`;
}
function setSkill(k,v){ upd(s=>{ s.skills=s.skills||{}; s.skills[k]=v; }); }
function tabActivities(s){
  const acts = (s.activities||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<div class="card"><h3>🏅 Add activity</h3>
  <form id="actForm" onsubmit="event.preventDefault();addAct()">
    <label class="f"><span>Activity / event</span><input type="text" name="name" required placeholder="e.g. Annual Day dance"></label>
    <div class="row2"><label class="f"><span>Date</span><input type="date" name="date" value="${today()}"></label><label class="f"><span>Type</span><select name="type">${ACT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label></div>
    <label class="f"><span>Achievement / note</span><input type="text" name="result" placeholder="e.g. Won 1st prize, Participated"></label>
    <button class="btn block">+ Add activity</button></form></div>
  ${acts.length?acts.map(a=>`<div class="entry act"><small>${fmt(a.date)} · ${esc(a.type||'')}</small><p><b>${esc(a.name)}</b>${a.result?' — '+esc(a.result):''}</p><button class="x" onclick="delEntry('activities','${esc(a.id)}')" aria-label="Remove">✕</button></div>`).join(''):`<div class="empty">No activities yet.</div>`}`;
}
function addAct(){ const fd=new FormData($('#actForm')); const a={id:uid('a'),name:fd.get('name').trim(),date:fd.get('date'),type:fd.get('type'),result:fd.get('result').trim()}; if(!a.name) return; upd(s=>{ (s.activities=s.activities||[]).push(a); }); toast('Activity added'); }
function delEntry(k,id){ upd(s=>{ s[k]=(s[k]||[]).filter(x=>x.id!==id); }); }
function tabNotes(s){
  const notes = (s.notes||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const ts = teachers();
  return `<div class="card"><h3>📝 Teacher's note</h3>
  <form id="noteForm" onsubmit="event.preventDefault();addNote()">
    <label class="f"><span>Note (shown in parent report)</span><textarea name="text" required placeholder="How is the child doing? Behaviour, friendships, eating, sleeping…"></textarea></label>
    <div class="row2"><label class="f"><span>Teacher</span><select name="teacher">${ts.map(t=>`<option ${t.id===s.teacherId?'selected':''}>${esc(t.name)}</option>`).join('')}<option value="">—</option></select></label><label class="f"><span>Date</span><input type="date" name="date" value="${today()}"></label></div>
    <button class="btn block">+ Save note</button></form></div>
  ${notes.length?notes.map(n=>`<div class="entry"><small>${fmt(n.date)}${n.teacher?' · '+esc(n.teacher):''}</small><p>${esc(n.text)}</p><button class="x" onclick="delEntry('notes','${esc(n.id)}')" aria-label="Remove">✕</button></div>`).join(''):`<div class="empty">No notes yet.</div>`}`;
}
function addNote(){ const fd=new FormData($('#noteForm')); const n={id:uid('n'),text:fd.get('text').trim(),teacher:fd.get('teacher'),date:fd.get('date')}; if(!n.text) return; upd(s=>{ (s.notes=s.notes||[]).push(n); }); toast('Note saved'); }

/* ---------- ID cards ---------- */
function idPreview(s){
  const cc = CCOL[s.cls]||'#1e2a78';
  return `<div class="idprev"><div class="h"><img src="${LOGO}" alt=""><div><b>LITTLE WINGS</b><span style="font-weight:800;font-size:10px">PLAY SCHOOL</span><br><em>Play, Learn, Fly High!</em></div></div><div class="rainbow"></div>
  <div class="body">${s.photo?`<img class="ph" style="border-color:${cc}" src="${esc(s.photo)}">`:`<div class="ph" style="border-color:${cc}">${esc(initials(s.name))}</div>`}
  <div class="nm">${esc(s.name)}</div><span class="pill" style="background:${cc};margin-top:3px">${esc((s.cls||'').toUpperCase())}</span>
  <table><tr><td>Adm. No</td><td>${esc(s.admNo||'-')}</td></tr><tr><td>D.O.B</td><td>${fmt(s.dob)||'-'}</td></tr><tr><td>Blood Gr.</td><td>${esc(s.blood||'-')}</td></tr><tr><td>Phone</td><td>${esc((s.father&&s.father.phone)||(s.mother&&s.mother.phone)||'-')}</td></tr></table></div><div class="rainbow"></div></div>`;
}
function showId(id){ const s=Store.data.students[id]; if(!s) return; S.sid=id; sheet(`<h3>ID card preview</h3>${idPreview(s)}<p class="muted" style="text-align:center;font-size:12.5px">The PDF includes the front and back (emergency contact, address, return-to school).</p><div class="acts"><button class="btn ghost" onclick="closeSheet()">Close</button><button class="btn green" onclick="download('idcard')">Download ID PDF</button></div>`); }
function viewIdCards(){
  const all = students().filter(s=>S.cls==='All'||s.cls===S.cls);
  return `<div class="hello"><h1>ID Cards</h1><p>Tap a student to preview and download their card</p></div>
  <div class="chips">${['All',...CLASSES.map(c=>c.k)].map(c=>`<button class="chip ${S.cls===c?'on':''}" onclick="S.cls='${c}';render()">${c}</button>`).join('')}</div>
  ${all.length?`<button class="btn green block" style="margin-bottom:12px" onclick="downloadAllIds()">⬇ Download all ${all.length} ID cards (one PDF)</button>`:''}
  <div class="slist">${all.map(s=>`<button class="sitem" onclick="showId('${esc(s.id)}')">${avatar(s)}<div class="meta"><b>${esc(s.name)}</b><small>${esc(s.admNo||'')} · ${s.photo?'Photo ✓':'⚠ No photo'}</small></div><span class="pill" style="background:${CCOL[s.cls]||'#888'}">${esc(s.cls||'')}</span></button>`).join('') || `<div class="empty">No students here yet.</div>`}</div>`;
}

/* ---------- PDF download ---------- */
function ctxFor(s){ return { logo: LOGO, school: Store.data.school, teacherName: teacherName(s.teacherId), skills: SKILLS }; }
function saveFile(doc, filename){
  try {
    const blob = doc.output('blob'), url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Downloading ' + filename);
  } catch(e) { console.error(e); toast('Could not download the PDF'); }
}
function download(kind){
  const s = cur(); if (!s) return;
  if (!window.jspdf) { toast('PDF tools are still loading – try again in a moment'); return; }
  try {
    const doc = PDF[kind](s, ctxFor(s));
    const base = (s.name||'student').replace(/[^\w]+/g,'_');
    saveFile(doc, { application:`${base}_Application.pdf`, idcard:`${base}_ID_Card.pdf`, report:`${base}_Parent_Report.pdf` }[kind]);
  } catch(e) { console.error(e); toast('Could not create the PDF'); }
}
function downloadAllIds(){
  const list = students().filter(s=>S.cls==='All'||s.cls===S.cls); if (!list.length) return;
  if (!window.jspdf) { toast('PDF tools are still loading – try again in a moment'); return; }
  try { saveFile(PDF.idcardMany(list, list.map(ctxFor)), `ID_Cards_${S.cls}.pdf`); } catch(e) { console.error(e); toast('Could not create the PDF'); }
}

/* ---------- Teachers & school settings ---------- */
function viewTeachers(){
  const ts = teachers(), all = students(), sc = Store.data.school, adm = isAdmin();
  const users = Object.values(Store.data.users).sort((a,b)=>(a.role==='pending'?0:1)-(b.role==='pending'?0:1) || String(a.name).localeCompare(String(b.name)));
  const pend = users.filter(u=>u.role==='pending').length;
  const ro = adm ? '' : 'disabled';
  return `<div class="hello"><h1>Teachers</h1><p>${ts.length} teacher${ts.length===1?'':'s'}${adm?' · you are an Admin':''}</p></div>
  ${adm ? `<div class="card"><h3>🔐 App access ${pend?`<span class="role pending">${pend} waiting</span>`:''}</h3>
    <p class="muted" style="margin:-4px 0 8px;font-size:13px">People appear here after they sign in once. Teachers can register and edit students; Admins can also manage access, staff, school details and delete records.</p>
    <div class="tlist">${users.map(u=>{ const self = Store.user && u.uid===Store.user.uid; return `<div class="t">${u.photo?`<img class="av" src="${esc(u.photo)}" referrerpolicy="no-referrer">`:`<div class="av" style="background:#1e2a78">${esc(initials(u.name))}</div>`}
      <div class="meta"><b>${esc(u.name||'')}</b> <span class="role ${esc(u.role)}">${u.role==='admin'?'Admin':u.role==='teacher'?'Teacher':'Waiting'}</span><br><small>${esc(u.email||'')}</small></div>
      ${self ? '<small class="muted">You</small>' : u.role==='pending'
        ? `<div style="display:flex;flex-direction:column;gap:4px"><button class="btn green sm" onclick="Store.setRole('${esc(u.uid)}','teacher');toast('Approved')">Approve</button><button class="btn ghost sm" onclick="removeUser('${esc(u.uid)}')">Reject</button></div>`
        : `<select style="width:auto;padding:6px 8px" onchange="changeRole('${esc(u.uid)}',this.value)"><option value="teacher" ${u.role==='teacher'?'selected':''}>Teacher</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option><option value="remove">Remove access</option></select>`}
    </div>`; }).join('') || '<div class="empty">No one else has signed in yet. Send teachers the app link.</div>'}</div>
    <button class="btn ghost block" style="margin-top:8px" onclick="copyLink()">📋 Copy app link to send teachers</button></div>` : ''}
  <div class="card"><h3 style="justify-content:space-between">👩‍🏫 Class teachers ${adm?'<button class="btn sm pink" onclick="editTeacher()">+ Add</button>':''}</h3>
  <div class="tlist">${ts.map(t=>`<div class="t"><div class="av" style="background:${CCOL[t.cls]||'#1e2a78'}">${esc(initials(t.name))}</div><div class="meta"><b>${esc(t.name)}</b><br><small>${esc(t.cls||'No class')} · ${all.filter(s=>s.teacherId===t.id).length} students${t.phone?' · '+esc(t.phone):''}</small></div>${adm?`<button class="btn ghost sm" onclick="editTeacher('${esc(t.id)}')">Edit</button>`:''}</div>`).join('') || '<div class="empty">No teachers yet.</div>'}</div></div>
  <div class="card"><h3>🏫 School details <small class="muted" style="font-family:Nunito;font-size:12px">printed on PDFs</small></h3>
  <form id="schoolForm" onsubmit="event.preventDefault();saveSchool()"><fieldset ${ro}>
    <label class="f"><span>School name</span><input type="text" name="name" value="${esc(sc.name)}"></label>
    <label class="f"><span>Address</span><input type="text" name="address" value="${esc(sc.address)}"></label>
    <div class="row2"><label class="f"><span>Phone</span><input type="tel" name="phone" value="${esc(sc.phone)}"></label><label class="f"><span>Academic year</span><input type="text" name="year" value="${esc(sc.year)}" placeholder="2026-27"></label></div>
    <label class="f"><span>Email</span><input type="email" name="email" value="${esc(sc.email)}"></label>
    ${adm?'<button class="btn block">Save school details</button>':'<p class="muted" style="font-size:12.5px;margin:0">Only Admins can change school details.</p>'}</fieldset></form></div>`;
}
async function changeRole(uid, role){
  if (role === 'remove') { await removeUser(uid); return; }
  Store.setRole(uid, role); toast('Role updated');
}
async function removeUser(uid){
  const u = Store.data.users[uid] || {};
  if (await confirmBox('Remove access?', (u.email||'This person') + ' will no longer be able to open student records. They can sign in again later and wait for approval.', 'Remove')) { Store.removeUser(uid); toast('Access removed'); }
  else render();
}
function copyLink(){
  const url = location.origin + location.pathname;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(()=>toast('Link copied – paste it in WhatsApp'), ()=>sheet(`<h3>App link</h3><p style="word-break:break-all"><b>${esc(url)}</b></p><div class="acts"><button class="btn" onclick="closeSheet()">Done</button></div>`));
}
function editTeacher(id){
  const t = id ? Store.data.teachers[id] : {};
  sheet(`<h3>${id?'Edit teacher':'Add teacher'}</h3><form id="tForm" onsubmit="event.preventDefault();saveTeacher('${id||''}')">
    <label class="f"><span>Name *</span><input type="text" name="name" required value="${esc(t.name)}" placeholder="e.g. Ms. Priya Sharma"></label>
    <div class="row2"><label class="f"><span>Class</span><select name="cls"><option value="">—</option>${CLASSES.map(c=>`<option ${c.k===t.cls?'selected':''}>${c.k}</option>`).join('')}</select></label><label class="f"><span>Mobile</span><input type="tel" name="phone" value="${esc(t.phone)}"></label></div>
    <label class="f"><span>Role</span><input type="text" name="role" value="${esc(t.role)}" placeholder="Class teacher / Assistant / Principal"></label>
    <div class="acts">${id?`<button type="button" class="btn danger" onclick="delTeacher('${id}')">Delete</button>`:`<button type="button" class="btn ghost" onclick="closeSheet()">Cancel</button>`}<button class="btn">Save</button></div></form>`);
}
function saveTeacher(id){
  const fd = new FormData($('#tForm')); const name = fd.get('name').trim(); if (!name) return;
  const t = Object.assign(id ? clone(Store.data.teachers[id]) : { id: uid('t'), createdAt: Date.now() }, { name, cls: fd.get('cls'), phone: fd.get('phone').trim(), role: fd.get('role').trim() });
  Store.save('teachers', t); closeSheet(); toast('Teacher saved'); render();
}
async function delTeacher(id){
  const n = students().filter(s=>s.teacherId===id).length;
  if (await confirmBox('Delete teacher?', n ? `${n} student(s) are assigned to this teacher. They will show no class teacher until you reassign them.` : 'This teacher will be removed.')) { Store.remove('teachers', id); toast('Teacher removed'); render(); }
}
function saveSchool(){ const fd=new FormData($('#schoolForm')); const o={}; ['name','address','phone','year','email'].forEach(k=>o[k]=(fd.get(k)||'').trim()); Store.saveSchool(o); toast('School details saved'); }

/* ---------- start ---------- */
(function start(){ const h=location.hash.slice(1); if (NAV.some(n=>n[0]===h)) S.view=h; setSync(); render(); Store.init(); })();
</script>
